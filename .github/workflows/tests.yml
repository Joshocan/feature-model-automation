name: Offline software checks
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/requirements-macos-arm64-py312.lock
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MPLBACKEND: Agg
