# config/experiment.yaml
# Frozen protocol for the iFS 2027 campaign.
#
# This file supersedes config/fame.yaml for anything the new N-granularity
# campaign runs on. fame.yaml stays only until the unified engine finishes decommissioning
# the legacy 4-pipeline entry points.
#
# Any change to a value below changes the campaign identity. The config loader
# MUST reject missing values (crash, do not default silently) and MUST write a
# resolved read-only snapshot into every campaign directory (per IFS §2.10).

# ─────────────────────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────────────────────
campaign:
  id: "ifs-2027"
  frozen_on: "2026-09-23"
  brief: "data/ground_truth/implementation-brief.md"
  expected_enabled_matrix:
    total_runs: 694
    total_calls: 6800
    lanes:
      open_weight: {runs: 644, calls: 6300}
      astra: {runs: 50, calls: 500}

execution:
  # Run the two provider lanes in parallel, but keep models within the shared
  # Ollama account sequential until an explicit rate-limit study says otherwise.
  provider_concurrency:
    ollama_cloud: 1
    openai: 1

# ─────────────────────────────────────────────────────────────────────────────
# Corpora (D2)
# ─────────────────────────────────────────────────────────────────────────────
corpora:
  federation:
    n_docs: 23
    raw_dir: "data/raw/federation"
    manifest: "data/raw/federation/manifest_fed.csv"
    ground_truth: "data/ground_truth/federation.xml"
    doc_id_prefix: "fed_"
  repair:
    n_docs: 54
    raw_dir: "data/raw/repair"
    manifest: "data/raw/repair/manifest_repair.csv"
    ground_truth: "data/ground_truth/repair.xml"
    doc_id_prefix: "rep_"

# ─────────────────────────────────────────────────────────────────────────────
# Chunking (2.1 — frozen)
# ─────────────────────────────────────────────────────────────────────────────
chunking:
  max_chunk_chars: 1500
  overlap_ratio: 0.15
  split_boundaries: ["section", "paragraph", "sentence"]
  strip_sections:
    - references
    - acknowledgements
    - author_biographies
    - copyright
    - front_matter
    - back_matter
  preprocessing_version: "v2-1500-15"   # bump on any change; participates in chunk_id hash

# ─────────────────────────────────────────────────────────────────────────────
# Retrieval (D6 four fixed sub-queries + nomic prefixes)
# ─────────────────────────────────────────────────────────────────────────────
retrieval:
  embedding_model: "nomic-embed-text"
  document_prefix: "search_document: "     # mandatory
  query_prefix:    "search_query: "        # mandatory
  similarity: "cosine"
  # Four fixed sub-queries. Identical at every step and in every RAG arm.
  # Merged + deduplicated by chunk_id after retrieval. Never modified against outcomes.
  sub_queries:
    - "search_query: what {domain} approach this paper proposes and what it operates on"
    - "search_query: how the approach works, its mechanism, algorithm or procedure"
    - "search_query: the options, modes, variants and alternatives the approach supports"
    - "search_query: what the approach requires, assumes, or guarantees"
  # k_doc frozen based on measured chunks-per-document.
  # Federation min = 17. Repair min = 5 (rep_15, an 11-page LNCS 2003 paper
  # whose extractable text is ~5.4k chars — all four extractors agree).
  # Values k_doc >= 5 on rep_15 at N=54 yield RAG == Non-RAG for that single
  # batch (1.9% of the N=54 Repair arm). Reported as a threat to validity.
  k_doc: 5
  k_doc_grid: [3, 5, 10, 15]
  # Distribution across 4 sub-queries: floor(k_step / 4) each; remainder
  # spread to the first (k_step % 4) sub-queries.
  sub_query_remainder_policy: "spread_first"

# ─────────────────────────────────────────────────────────────────────────────
# Generation models (2.3 — frozen)
# ─────────────────────────────────────────────────────────────────────────────
generation_models:
  minimax_m3:
    provider: "ollama_cloud"
    model_id: "minimax-m3:cloud"         # :cloud suffix routes to Ollama cloud, no local pull
    context_window_tokens: 512000         # hosted tag's guaranteed context window
    max_output_tokens: 32768
    reasoning_effort: "low"     # pilot-only configuration; model is excluded from the campaign
    temperature: 0.2
    serving_endpoint: "https://ollama.com"
    aa_index: null               # record the applicable snapshot rank before campaign freeze
    role: "open_weight_pilot_candidate"
    lane: "excluded"
    enabled: false
    participation:                  # per-arm N values it participates in
      baseline_N:            []
      headline_N:            []
      repair_curve_N:        []
      federation_curve_N:    []
      ablation_N:            []
      order_sensitivity_N:   []
      k_doc_sweep_N:         []
  deepseek_v4_1_flash:
    provider: "ollama_cloud"
    model_id: "deepseek-v4.1-flash:cloud"
    context_window_tokens: 1000000
    max_output_tokens: 32768
    reasoning_effort: "low"     # open-weight: same as MiniMax — no silent thinking
    temperature: 0.2
    serving_endpoint: "https://ollama.com"
    aa_index: 40
    role: "open_weight"
    lane: "open_weight"
    enabled: true
    participation:
      baseline_N:            [1]
      headline_N:            [10]
      repair_curve_N:        [5, 20, 54]
      federation_curve_N:    [5, 23]
      ablation_N:            [1, 10]
      order_sensitivity_N:   [10, 54]
      k_doc_sweep_N:         [10]
  gpt_oss_120b:
    provider: "ollama_cloud"
    model_id: "gpt-oss:120b-cloud"
    context_window_tokens: 128000
    max_output_tokens: 16384
    reasoning_effort: "low"     # level-based reasoning; sent to Ollama as think="low"
    temperature: 0.2
    serving_endpoint: "https://ollama.com"
    aa_index: null
    role: "open_weight_pilot_candidate"
    lane: "excluded"
    enabled: false               # smoke/probe explicitly; exclude from campaign until accepted
    participation:
      baseline_N:            []
      headline_N:            []
      repair_curve_N:        []
      federation_curve_N:    []
      ablation_N:            []
      order_sensitivity_N:   []
      k_doc_sweep_N:         []
  glm_5_3_flash:
    provider: "ollama_cloud"
    model_id: "glm-5.3-flash:cloud"
    context_window_tokens: 1000000
    max_output_tokens: 32768
    reasoning_effort: "low"     # level-based reasoning; sent to Ollama as think="low"
    temperature: 0.2
    serving_endpoint: "https://ollama.com"
    aa_index: null
    role: "open_weight"
    lane: "open_weight"
    enabled: true
    participation:
      baseline_N:            [1]
      headline_N:            [10]
      repair_curve_N:        [5, 20, 54]
      federation_curve_N:    [5, 23]
      ablation_N:            [1, 10]
      order_sensitivity_N:   [10, 54]
      k_doc_sweep_N:         [10]
  deepseek_v4_pro:
    provider: "ollama_cloud"
    model_id: "deepseek-v4-pro:cloud"
    context_window_tokens: 1000000
    max_output_tokens: 16384
    reasoning_effort: "low"     # campaign low policy maps to Ollama think=false
    temperature: 0.2
    serving_endpoint: "https://ollama.com"
    aa_index: null
    role: "open_weight_pilot_candidate"
    lane: "excluded"
    enabled: false               # smoke/probe explicitly; exclude from campaign until accepted
    participation:
      baseline_N:            []
      headline_N:            []
      repair_curve_N:        []
      federation_curve_N:    []
      ablation_N:            []
      order_sensitivity_N:   []
      k_doc_sweep_N:         []
  gpt_6_astra:
    provider: "openai"
    model_id: "gpt-6-astra"
    context_window_tokens: 1050000       # verified against official model documentation
    max_output_tokens: 32768
    reasoning_effort: "medium"
    temperature: 1.0                     # model supports only its fixed default temperature
    aa_index: 51
    role: "proprietary_ceiling"
    lane: "astra"
    enabled: true
    # Reduced proprietary-ceiling campaign: 50 new runs / 500 calls. Existing
    # N=5 RAG and N=1 Non-RAG pilots remain characterization evidence and are
    # not silently imported as new campaign repetitions.
    participation:
      custom_cells:
        - {arm: guided_headline, corpus: repair, N: 10, grounding: rag,
           repetitions: 10, metamodel_block: true}
        - {arm: guided_headline, corpus: repair, N: 10, grounding: nonrag,
           repetitions: 10, metamodel_block: true}
        - {arm: ablation, corpus: repair, N: 10, grounding: rag,
           repetitions: 10, metamodel_block: false}
        - {arm: ablation, corpus: federation, N: 10, grounding: rag,
           repetitions: 10, metamodel_block: false}
        - {arm: astra_cross_corpus, corpus: federation, N: 10, grounding: rag,
           repetitions: 10, metamodel_block: true}

# ─────────────────────────────────────────────────────────────────────────────
# Prompt assembly + provenance marker (2.2)
# ─────────────────────────────────────────────────────────────────────────────
prompt:
  template: "prompts/fm_prompt_template.txt"
  metamodel_schema: "prompts/feature-model-schema.xsd"
  # Invariant blocks first (system, metamodel, output contract, guidance, provenance);
  # variable blocks last (context, previous model). Enables prefix caching.
  block_order: ["system", "metamodel", "output_contract", "guidance", "provenance", "previous_model", "context"]
  # Provenance marker grammar. Frozen. Never changes during the campaign.
  marker_regex: "Trace:\\s*\\[\\s*([A-Za-z0-9_,\\s]+?)\\s*\\]\\s*\\Z"
  marker_example: "Trace: [rep_01, rep_17]"

# ─────────────────────────────────────────────────────────────────────────────
# Instrument — semantic (D15)
# ─────────────────────────────────────────────────────────────────────────────
instrument_semantic:
  matching_embedding_model: "all-mpnet-base-v2"
  similarity: "cosine"
  tau_primary: 0.4
  tau_sweep: [0.3, 0.4, 0.5, 0.6]     # free rescore of D15
  # Recall targets: reach(T,C) primary, F_t as labelled bound, F_t^att / F_t^org separately.
  recall_targets: ["reach", "F_t", "F_t_attested", "F_t_organising"]

# ─────────────────────────────────────────────────────────────────────────────
# Instrument — structural (D17)
# ─────────────────────────────────────────────────────────────────────────────
instrument_structural:
  primary: "parent_match"
  # Coverage weights are a design choice, no sweep; retained for reporting only.
  coverage_feature_weight: 0.8
  coverage_parent_weight: 0.2

# ─────────────────────────────────────────────────────────────────────────────
# Instrument — logical (D13, D14)
# ─────────────────────────────────────────────────────────────────────────────
instrument_logical:
  well_formed_conditions: ["W1", "W2", "W3", "W4", "W5"]
  sat_solver: null           # TBD (2.6) — likely FeatureIDE's Sat4j; verify + pin
  sat_solver_version: null   # TBD

# ─────────────────────────────────────────────────────────────────────────────
# Instrument — statistics
# ─────────────────────────────────────────────────────────────────────────────
instrument_stats:
  central_tendency: "mean_with_95ci"
  comparison_test: "mann_whitney_u"
  multiple_comparison_correction: "holm"
  effect_size: "cliffs_delta"
  inter_rater_agreement: "cohen_kappa_quadratic_weighted"

# ─────────────────────────────────────────────────────────────────────────────
# Candidate selection (Top-FM)
# ─────────────────────────────────────────────────────────────────────────────
selection:
  score_formula: "alpha * F1 + beta * coverage"
  alpha: 0.6
  beta: 0.4
  tie_break: ["score", "F1", "coverage", "generation_order_negated"]
  f_m: null                  # TBD (2.5) — number of top candidates retained
  admissibility:
    conformance_required: true
    satisfiability_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Encoders (D12) — actual pins recorded in data/encoder_versions.txt
# ─────────────────────────────────────────────────────────────────────────────
encoders:
  retrieval: "nomic-embed-text"
  matching: "all-mpnet-base-v2"
  pins_file: "data/encoder_versions.txt"

# ─────────────────────────────────────────────────────────────────────────────
# Frozen artefacts (D5, D6) — hashes recorded in data/frozen/
# ─────────────────────────────────────────────────────────────────────────────
frozen_artefacts:
  hashes_file: "data/frozen/protocol.sha256"
  paths:
    - "prompts/fm_prompt_template.txt"
    - "prompts/feature-model-schema.xsd"
    - "config/experiment.yaml"
    # D22 orderings.json
    # D4 attribution.csv per corpus
    # D21 feature_partition.csv per corpus

# ─────────────────────────────────────────────────────────────────────────────
# Open decisions (non-blocking; do not block campaign start)
# ─────────────────────────────────────────────────────────────────────────────
open_decisions:
  k_doc: "P4 — set after chunks-per-document measured"
  f_m: "2.5 — retained candidate count for Top-FM analysis"
  sat_solver: "2.6 — name + version + pin"
  expert_rubric: "2.7 — wording"
  judge_model: "P9 — evaluator LLM for D18/D19 (avoid self-preference bias)"
